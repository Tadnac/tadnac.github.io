<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odpočet</title>
<style>
  :root {
    --ink: #f2f6ff;
    --muted: #9fb0d0;
    --a1: #ffb86b;
    --a2: #ff6f91;
    --b1: #5ee7df;
    --b2: #6a8dff;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 1.25rem;
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: #0a1030;
    overflow-x: hidden;
    position: relative;
  }
  /* pomalu plující světelné skvrny na pozadí */
  .glow { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .55; z-index: 0; pointer-events: none; }
  .g1 { width: 55vmax; height: 55vmax; background: #3a2bd9; top: -20vmax; left: -15vmax; animation: drift1 26s ease-in-out infinite alternate; }
  .g2 { width: 45vmax; height: 45vmax; background: #d9467e; bottom: -22vmax; right: -12vmax; animation: drift2 30s ease-in-out infinite alternate; }
  .g3 { width: 30vmax; height: 30vmax; background: #14b8c4; bottom: 10vmax; left: 25vmax; opacity: .3; animation: drift1 34s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate(12vmax, 8vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-10vmax, -9vmax) scale(1.1); } }

  main {
    position: relative; z-index: 1;
    width: 100%; max-width: 760px;
    padding: clamp(1.5rem, 5vw, 3rem);
    text-align: center;
    background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 32px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,.4);
  }
  h1 { margin: 0; font-size: clamp(1.1rem, 3.5vw, 1.5rem); font-weight: 400; letter-spacing: .02em; color: var(--muted); }
  .target {
    margin: .4rem 0 clamp(1.5rem, 5vw, 2.5rem);
    font-size: clamp(1.6rem, 6vw, 2.6rem); font-weight: 600;
    background: linear-gradient(90deg, var(--a1), var(--a2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .dials { display: flex; justify-content: center; gap: clamp(.75rem, 4vw, 2.5rem); }
  .dial { position: relative; width: min(42vw, 270px); aspect-ratio: 1; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { fill: none; stroke: rgba(255,255,255,.1); }
  .bar { fill: none; stroke-linecap: round; transition: stroke-dashoffset .9s ease; }
  .inner {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .num {
    font-size: clamp(2.6rem, 13vw, 5.5rem);
    font-weight: 200; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .label { margin-top: .3rem; font-size: clamp(.85rem, 2.6vw, 1.05rem); color: var(--muted); }
  .sub { margin: clamp(1.25rem, 4vw, 2rem) 0 0; font-size: clamp(.9rem, 2.6vw, 1.05rem); color: var(--muted); }
  .sub b { color: var(--ink); font-weight: 600; }
  .note { margin: .5rem 0 0; font-size: .85rem; color: var(--muted); opacity: .8; }
  @media (prefers-reduced-motion: reduce) {
    .glow { animation: none; }
    .bar { transition: none; }
  }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

<main>
  <h1 id="title">Do termínu zbývá</h1>
  <p class="target" id="target"></p>

  <div class="dials" role="timer" aria-live="off">
    <div class="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="gh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb86b"/><stop offset="1" stop-color="#ff6f91"/></linearGradient></defs>
        <circle class="track" cx="100" cy="100" r="88" stroke-width="10"/>
        <circle class="bar" id="ringH" cx="100" cy="100" r="88" stroke-width="10" stroke="url(#gh)"/>
      </svg>
      <div class="inner"><span class="num" id="h">0</span><span class="label">hodin</span></div>
    </div>
    <div class="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee7df"/><stop offset="1" stop-color="#6a8dff"/></linearGradient></defs>
        <circle class="track" cx="100" cy="100" r="88" stroke-width="10"/>
        <circle class="bar" id="ringM" cx="100" cy="100" r="88" stroke-width="10" stroke="url(#gm)"/>
        <circle class="track" cx="100" cy="100" r="74" stroke-width="3"/>
        <circle class="bar" id="ringS" cx="100" cy="100" r="74" stroke-width="3" stroke="#ffffff" style="transition:none;opacity:.7"/>
      </svg>
      <div class="inner"><span class="num" id="m">00</span><span class="label">minut</span></div>
    </div>
  </div>

  <p class="sub" id="sub"></p>
  <p class="note" id="note"></p>
</main>

<script>
  // Cílové datum a čas (místní čas): 6. 10. 2026 10:00.
  // Lze přepsat v URL, např. ?do=2026-12-24T18:00
  const DEFAULT_TARGET = "2026-10-06T10:00:00";
  const param = new URLSearchParams(location.search).get("do");
  let target = new Date(param || DEFAULT_TARGET);
  if (isNaN(target)) target = new Date(DEFAULT_TARGET);

  const $ = id => document.getElementById(id);
  const C = 2 * Math.PI * 88, C2 = 2 * Math.PI * 74;
  $("ringH").style.strokeDasharray = C;
  $("ringM").style.strokeDasharray = C;
  $("ringS").style.strokeDasharray = C2;

  $("target").textContent = target.toLocaleString("cs-CZ", {
    day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit"
  });

  const plural = (n, a, b, c) => n === 1 ? a : (n >= 2 && n <= 4 ? b : c);

  function tick() {
    const diff = target - Date.now();
    const past = diff < 0;
    const totalSec = Math.floor(Math.abs(diff) / 1000);
    const totalMin = Math.floor(totalSec / 60);
    const hours = Math.floor(totalMin / 60);
    const mins = totalMin % 60;
    const secs = totalSec % 60;
    const days = Math.floor(hours / 24);
    const hRest = hours % 24;

    $("h").textContent = hours.toLocaleString("cs-CZ");
    $("m").textContent = String(mins).padStart(2, "0");

    // Prstence: hodiny v rámci dne, minuty v rámci hodiny, vteřiny v rámci minuty
    $("ringH").style.strokeDashoffset = C * (1 - hRest / 24);
    $("ringM").style.strokeDashoffset = C * (1 - mins / 60);
    $("ringS").style.strokeDashoffset = C2 * (1 - secs / 60);

    $("title").textContent = past ? "Od termínu uplynulo" : "Do termínu zbývá";
    $("sub").innerHTML = days > 0
      ? "To je <b>" + days + " " + plural(days, "den", "dny", "dní") + "</b> a <b>" + hRest + " " + plural(hRest, "hodina", "hodiny", "hodin") + "</b>"
      : "";
    $("note").textContent = past ? "Jiný čas nastavíte v adrese pomocí ?do=2026-12-24T18:00" : "";
    document.title = (past ? "−" : "") + hours + " h " + mins + " min";
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
