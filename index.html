<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odpočet</title>
<style>
  :root {
    --bg: #e8eef1;
    --ink: #13212b;
    --muted: #5a6b76;
    --accent: #1d6b86;
    --card: #f7fafb;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1a21; --ink: #e6eef2; --muted: #8fa3af; --accent: #6bc0dc; --card: #16252e; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  main {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border-left: 6px solid var(--accent);
    padding: clamp(1.5rem, 6vw, 3rem);
  }
  h1 { font-size: 1.1rem; font-weight: normal; margin: 0 0 .25rem; color: var(--muted); }
  .target { font-size: 1.4rem; margin: 0 0 2rem; }
  .time { display: flex; gap: clamp(1rem, 6vw, 2.5rem); align-items: flex-end; }
  .unit { display: flex; flex-direction: column; }
  .num {
    font-size: clamp(3.5rem, 18vw, 7rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .label { font-size: 1rem; color: var(--muted); margin-top: .35rem; }
  .status { margin: 2rem 0 0; color: var(--muted); font-size: .95rem; line-height: 1.5; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Do konce zbývá</h1>
  <p class="target" id="target"></p>
  <div class="time" role="timer" aria-live="off">
    <div class="unit"><span class="num" id="h">0</span><span class="label">hodin</span></div>
    <div class="unit"><span class="num" id="m">00</span><span class="label">minut</span></div>
  </div>
  <p class="status" id="status"></p>
</main>

<script>
  // Cílové datum a čas (místní čas): 6. 10. 2026 10:00.
  // Lze přepsat v URL, např. ?do=2026-12-24T18:00
  const DEFAULT_TARGET = "2026-10-06T10:00:00";
  const param = new URLSearchParams(location.search).get("do");
  let target = new Date(param || DEFAULT_TARGET);
  if (isNaN(target)) target = new Date(DEFAULT_TARGET);

  const el = id => document.getElementById(id);
  el("target").textContent = target.toLocaleString("cs-CZ", {
    day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit"
  });

  function tick() {
    const diff = target - Date.now();
    const past = diff < 0;
    const totalMin = Math.floor(Math.abs(diff) / 60000);
    const hours = Math.floor(totalMin / 60);
    const mins = totalMin % 60;

    el("h").textContent = hours.toLocaleString("cs-CZ");
    el("m").textContent = String(mins).padStart(2, "0");
    el("title").textContent = past ? "Od termínu uplynulo" : "Do termínu zbývá";
    el("status").textContent = past
      ? "Termín už nastal. Jiný čas nastavíte v adrese pomocí ?do=2026-12-24T18:00."
      : "Aktualizuje se automaticky.";
    document.title = (past ? "−" : "") + hours + " h " + mins + " min";
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
